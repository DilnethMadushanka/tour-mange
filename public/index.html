<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

</head><body>
<title>TourFleet Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar with company switch + tabs; one working pane below; editors open as a side sheet. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e8eceb; --line:#d3dad8; --fg:#17201e; --muted:#5b6865;
  --accent:#0f6b5c; --accent-fg:#ffffff; --accent-soft:#d7ece7; --road:#c4791b;
  --ok:#1f7a3d; --ok-soft:#dcf1e2; --warn:#9a6200; --warn-soft:#fbecc9; --bad:#b3261e; --bad-soft:#f9dedc;
  --busy:#2d5f8a; --busy-soft:#d9e6f2;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#18201f; --sunk:#111917; --line:#2c3836; --fg:#e4ebe9; --muted:#9aa8a5;
  --accent:#4fbfa8; --accent-fg:#06201b; --accent-soft:#18372f; --road:#e3a14d;
  --ok:#6fcf8e; --ok-soft:#173523; --warn:#f0bf5a; --warn-soft:#3a2d10; --bad:#f2958c; --bad-soft:#401a17;
  --busy:#8bb8e0; --busy-soft:#1b2c3d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#18201f; --sunk:#111917; --line:#2c3836; --fg:#e4ebe9; --muted:#9aa8a5;
  --accent:#4fbfa8; --accent-fg:#06201b; --accent-soft:#18372f; --road:#e3a14d;
  --ok:#6fcf8e; --ok-soft:#173523; --warn:#f0bf5a; --warn-soft:#3a2d10; --bad:#f2958c; --bad-soft:#401a17;
  --busy:#8bb8e0; --busy-soft:#1b2c3d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:20px} h2{font-size:18px} h3{font-size:15px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{flex:none}
.brand small{display:block;color:var(--muted);font-size:12px;font-family:var(--body);font-weight:400}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding-bottom:0}
nav.tabs a{padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--fg);border-color:var(--road)}
nav.tabs a:hover{color:var(--fg)}
main{padding-block:20px 60px;display:grid;gap:20px}
.banner{font-size:13px;padding:8px 12px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.muted{color:var(--muted)} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:6px;cursor:pointer;line-height:1.3}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button.danger{color:var(--bad);border-color:transparent;background:transparent}
button.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
button.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
button.small{padding:4px 8px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--road);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;background:var(--sunk)}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.paid{background:var(--ok-soft);color:var(--ok)}
.chip.partial{background:var(--warn-soft);color:var(--warn)}
.chip.pending{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.chip.overdue{background:var(--bad-soft);color:var(--bad)}
.chip.free{background:var(--ok-soft);color:var(--ok)}
.chip.busy{background:var(--busy-soft);color:var(--busy)}
.chip.cancel{background:var(--sunk);color:var(--muted);text-decoration:line-through}
.chip.ex{background:var(--warn-soft);color:var(--warn);font-weight:500}
.empty{padding:28px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.list{display:grid;gap:0}
.list > div{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.list > div:last-child{border-bottom:0}
.plate{font-family:var(--mono);font-size:12px;padding:1px 6px;border:1px solid var(--line);border-radius:4px;background:var(--sunk);white-space:nowrap}
/* timeline */
.tl{border-collapse:separate;border-spacing:2px;min-width:0;width:auto}
.tl th,.tl td{border:0;padding:0;background:none}
.tl th.d{font-family:var(--mono);font-size:10px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);text-align:center;width:26px;line-height:1.2;padding-bottom:4px}
.tl th.d.we{color:var(--road)}
.tl td.v{padding-right:10px;white-space:nowrap;font-size:13px;position:sticky;left:0;background:var(--surface)}
.tl td.c{width:26px;height:24px;border-radius:3px;background:var(--sunk)}
.tl td.c.on{background:var(--busy)}
.tl td.c.on.start{border-top-left-radius:10px;border-bottom-left-radius:10px}
.tl td.c.on.end{border-top-right-radius:10px;border-bottom-right-radius:10px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,15,.45);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(760px,100%);height:100%;overflow-y:auto;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:1;flex-wrap:wrap}
.sheet-body{padding:18px;display:grid;gap:18px}
.sec{display:grid;gap:12px;align-content:start}
.sec > .spread h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--body);font-weight:600}
.lines{display:grid;gap:8px}
.line{display:grid;gap:8px;grid-template-columns:150px 1fr 1fr 1.3fr auto;align-items:end;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.day{display:grid;gap:8px;padding:12px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--road);border-radius:6px}
.day .dn{font-family:var(--mono);font-size:12px;color:var(--road);font-weight:500}
.vpick{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.vpick label{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-size:13px}
.vpick label input{width:auto;margin-top:3px}
.vpick label.clash{border-color:var(--bad)}
.warnbox{padding:8px 12px;border-radius:6px;background:var(--bad-soft);color:var(--bad);font-size:13px}
.sum{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
.sum b{font-family:var(--mono);font-weight:500;font-size:15px;display:block}
/* month calendar */
.cal{display:grid;gap:12px}
.cal-head{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.cal-title{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.01em}
.cal-title small{font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted);margin-left:8px;letter-spacing:0}
.cal-nav{display:flex;gap:4px;align-items:center}
.cal-nav button{min-width:36px}
.cal-grid{min-width:340px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.cal-dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--sunk);border-bottom:1px solid var(--line)}
.cal-dow div{padding:6px 8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cal-dow div.we{color:var(--road)}
.wk{border-bottom:1px solid var(--line);min-height:100px;position:relative}
.wk .bg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wk .bars{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:30px 0 6px;pointer-events:none}
.wk .bars .bar{pointer-events:auto}
.wk:last-child{border-bottom:0}
.cell{border-right:1px solid var(--line);padding:4px 6px;cursor:pointer;min-width:0}
.cell:nth-child(7){border-right:0}
@media (max-width:640px){ .wk .bars{padding-top:26px} }
.cell:hover{background:var(--sunk)}
.cell.out{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--sunk) 6px 7px)}
.cell .dn{font-family:var(--mono);font-size:12px;color:var(--muted);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%}
.cell.out .dn{opacity:.5}
.cell.today .dn{background:var(--road);color:#fff;font-weight:500}
.bar{position:relative;z-index:1;margin:2px 3px;padding:2px 8px;border-radius:5px;font-size:12px;font-weight:500;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:0;text-align:left;
  background:var(--busy-soft);color:var(--busy);border-left:3px solid var(--busy)}
.bar.paid{background:var(--ok-soft);color:var(--ok);border-left-color:var(--ok)}
.bar.partial{background:var(--warn-soft);color:var(--warn);border-left-color:var(--warn)}
.bar.overdue{background:var(--bad-soft);color:var(--bad);border-left-color:var(--bad)}
.bar.cont-l{border-top-left-radius:0;border-bottom-left-radius:0;border-left-style:dotted}
.bar.cont-r{border-top-right-radius:0;border-bottom-right-radius:0}
.bar:hover{filter:brightness(.96)}
.bar .veh{opacity:.75;font-weight:400}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.mstats{display:flex;gap:22px;flex-wrap:wrap}
.mstats div{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mstats b{display:block;font-family:var(--mono);font-size:17px;font-weight:500;color:var(--fg);text-transform:none;letter-spacing:0}
@media (max-width:640px){ .wk{min-height:74px} .bar{font-size:10px;padding:1px 4px;margin:1px} .bar .veh{display:none} .cell{padding:2px 3px} .cal-dow div{padding:4px 3px;font-size:10px} }
nav.tabs a{display:flex;align-items:center;gap:7px}
nav.tabs a .sm{display:none}
.agenda{display:none}
@media (max-width:640px){
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .brand small{display:none}
  .topbar{gap:8px;padding-block:8px}
  .topbar > .row{width:100%;flex-wrap:nowrap}
  .topbar > .row select{flex:1;max-width:none!important}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  nav.tabs a{flex-direction:column;gap:2px;padding:8px 2px 7px;font-size:11px;border-bottom:0;border-top:2px solid transparent;justify-content:center}
  nav.tabs a[aria-current="page"]{border-color:var(--road);color:var(--accent)}
  nav.tabs a .lg{display:none} nav.tabs a .sm{display:inline}
  main{padding-block:14px 24px;gap:14px}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  input,select,textarea{font-size:16px}
  .panel{padding:14px}
  .stats{grid-template-columns:1fr 1fr;gap:8px}
  .stats .stat:last-child:nth-child(odd){grid-column:1 / -1}
  .stat b{font-size:17px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  /* tables become cards */
  .tablebox{border:0;background:none;overflow:visible}
  .tablebox table{min-width:0;display:block}
  .tablebox thead{display:none}
  .tablebox tbody{display:grid;gap:10px}
  .tablebox tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
  .tablebox td{border:0;padding:0;text-align:left;min-width:0}
  .tablebox td[data-label]::before{content:attr(data-label);display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-family:var(--body)}
  .tablebox td:nth-child(1),.tablebox td:nth-child(2){grid-column:1 / -1}
  .tablebox td:nth-child(2)::before{display:none!important}
  .tablebox tr.click:hover td{background:none}
  .tablebox td.num{text-align:left}
  .tablebox td[colspan]{grid-column:1 / -1}
  .tablebox td[colspan]::before{display:none}
  .cal-head .row{width:100%}
  .cal-head .row select{flex:1 1 100%}
  .cal-nav{flex:1}
  .cal-title{font-size:20px}
  .mstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .wk{min-height:58px}
  .bar{height:14px;padding:0 3px;font-size:9px;line-height:14px}
  .agenda{display:grid}
  .cal-grid{min-width:0}
  .cal-dow div{text-align:center}
  #fQ{max-width:none!important}
  .sheet-head{padding:10px 14px}
  .sheet-head h2{font-size:16px}
  .sheet-body{padding:14px;gap:16px}
  .vpick{grid-template-columns:1fr}
  .day .fields{grid-template-columns:1fr 1fr}
}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;z-index:40;font-size:13px}
@media (max-width:620px){ .line{grid-template-columns:1fr 1fr} .line > :last-child{grid-column:1 / -1;justify-self:end} }
@media (prefers-reduced-motion:no-preference){ .sheet.anim{animation:slide .18s ease-out} @keyframes slide{from{transform:translateX(24px);opacity:.6}} }
/* invoice: editor on the left, printable paper on the right (paper stays light in dark mode) */
.inv-layer{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.inv-tools{position:sticky;top:0;z-index:1;background:var(--surface);border-bottom:1px solid var(--line)}
.inv-tools .wrap{display:flex;gap:8px;flex-wrap:nowrap;align-items:center;justify-content:space-between;padding-block:10px}
.inv-wrap{max-width:1180px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:grid;gap:18px;grid-template-columns:minmax(0,370px) minmax(0,1fr);align-items:start}
.inv-edit{display:grid;gap:14px}
.inv-edit .fields{grid-template-columns:1fr 1fr}
.inv-prev{display:none}
.iline{display:grid;gap:6px;grid-template-columns:72px minmax(0,1fr) auto;align-items:end;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.iline > .f:first-child{grid-column:1 / -1}
.inv-tools .row{flex-wrap:nowrap;gap:6px}
.paper{scroll-margin-top:70px;background:#fff;color:#1d2321;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 30px rgba(0,0,0,.08);padding:44px 48px;width:100%;max-width:820px;font-family:var(--body);font-size:13px;line-height:1.5;color-scheme:light;position:relative;overflow:hidden}
.paper .ph{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-bottom:20px;border-bottom:3px solid #0f6b5c}
.paper .logo{display:block;max-height:70px;max-width:220px;width:auto;object-fit:contain;margin-bottom:10px}
.logo-box{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px;border:1px dashed var(--line);border-radius:6px;background:var(--surface)}
.logo-box img{max-height:64px;max-width:180px;object-fit:contain;background:#fff;border-radius:4px;padding:4px}
.paper .co{font-family:var(--display);font-size:22px;font-weight:700;color:#0f6b5c;line-height:1.15}
.paper .co-d{color:#55625f;font-size:12px;white-space:pre-line;margin-top:4px}
.paper .tt{text-align:right}
.paper .tt h2{font-family:var(--display);font-size:28px;letter-spacing:.08em;color:#1d2321}
.paper .meta{display:grid;grid-template-columns:auto auto;gap:2px 14px;justify-content:end;margin-top:6px;font-size:12px}
.paper .meta span{color:#6a7673;text-align:right} .paper .meta b{font-family:var(--mono);font-weight:500;text-align:right}
.paper .blocks{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:20px 0}
.paper .lbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#6a7673;margin-bottom:4px}
.paper .blocks b{font-size:15px;font-weight:600}
.paper .kv{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:12px} .paper .kv span{color:#6a7673}
.paper table{min-width:0;width:100%;border-collapse:collapse;margin-top:4px}
.paper th{background:#eef3f1;color:#4d5a57;font-size:10px;letter-spacing:.08em;padding:8px 10px;border:0}
.paper td{padding:9px 10px;border-bottom:1px solid #e1e7e5;color:#1d2321}
.paper td.num,.paper th.num{text-align:right}

<script>
(() => {
'use strict';
const COLS = ['companies','vehicles','tours'];
const S = { companies:{}, vehicles:{}, tours:{} };
let db = null, auth = null, user = null, unsubs = [], subCo = {}, invites = {}, mode = 'loading', loaded = {companies:false,vehicles:false,tours:false};
let view = 'overview', companyId = null, draft = null, draftKind = null;
const ui = { calMonth:null, calVeh:'', tourFilter:'all', tourWhen:'upcoming', tourQ:'', avFrom:null, avTo:null, avType:'' };

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => iso(new Date());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtD = s => { if(!s) return '—'; const d = parse(s); return d.getDate()+' '+MON[d.getMonth()]; };
const fmtDY = s => { if(!s) return '—'; const d = parse(s); return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear(); };
const range = (a,b) => a && b ? (a===b ? fmtDY(a) : (a.slice(0,4)===b.slice(0,4) ? fmtD(a)+' – '+fmtDY(b) : fmtDY(a)+' – '+fmtDY(b))) : '—';
const overlaps = (a1,a2,b1,b2) => a1 <= b2 && b1 <= a2;
const n = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
const cur = () => (S.companies[companyId]?.currency || 'LKR');
const money = v => cur() + ' ' + Math.round(n(v)).toLocaleString('en-US');
function toast(msg){ const t = document.createElement('div'); t.className='toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2200); }
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

/* ---------- store ---------- */
const docRef = (col, id, data) => col === 'companies' ? db.collection('companies').doc(id) : db.collection('companies').doc(data.companyId).collection(col).doc(id);
const myEmail = () => (user?.email || '').toLowerCase();
const isOwner = cid => !db || S.companies[cid]?.ownerId === user?.uid;
async function save(col, id, data){
  S[col][id] = data; render();
  if (db) { try { await docRef(col, id, data).set(data); } catch(e){ toast('Could not save: ' + (e?.message || e?.code || 'error')); } }
  else lsSet('tfd-data', S);
}
async function remove(col, id){
  const data = S[col][id]; delete S[col][id]; render();
  if (db && data) { try { await docRef(col, id, data).delete(); } catch(e){ toast('Could not delete: ' + (e?.message || 'error')); } }
  else lsSet('tfd-data', S);
}
async function coUpdate(cid, fields, okMsg){
  try { await db.collection('companies').doc(cid).update(fields); if (okMsg) toast(okMsg); }
  catch(e){ toast('Could not update: ' + (e?.message || e?.code)); }
}
async function boot(){
  render();
  const cfg = window.FIREBASE_CONFIG || {};
  if (window.firebase && cfg.apiKey && !cfg.apiKey.startsWith('PASTE')) {
    try { firebase.initializeApp(cfg); } catch(e) { toast('Firebase setup error: ' + e.message); }
    auth = firebase.auth();
    auth.onAuthStateChanged(u => {
      user = u;
      if (!u) { mode = 'login'; unsubs.forEach(f=>f()); unsubs = []; Object.values(subCo).forEach(a=>a.forEach(f=>f())); subCo = {}; invites = {}; COLS.forEach(c=>{S[c]={};loaded[c]=false;}); companyId = null; render(); return; }
      db = firebase.firestore(); mode = 'loading'; render(); subscribe();
    });
    return;
  }
  if (!db) {
    mode = 'local';
    const saved = lsGet('tfd-data');
    if (saved) COLS.forEach(c => S[c] = saved[c] || {});
    COLS.forEach(c => loaded[c] = true);
    pickCompany(); render(); return;
  }
}
function subscribe(){
  mode = 'shared';
  const timer = setTimeout(() => { if (!loaded.companies) { mode = 'slow'; render(); } }, 10000);
  const dropCo = (col, cid) => Object.keys(S[col]).forEach(id => { if (S[col][id].companyId === cid) delete S[col][id]; });
  unsubs.push(db.collection('companies').where('members', 'array-contains', user.uid).onSnapshot({includeMetadataChanges: true}, snap => {
    const mine = {}, pending = new Set(); snap.docs.forEach(d => { mine[d.id] = d.data(); if (d.metadata.hasPendingWrites) pending.add(d.id); });
    S.companies = mine; loaded.companies = true; clearTimeout(timer); if (mode === 'slow') mode = 'shared';
    Object.keys(subCo).forEach(cid => { if (!mine[cid]) { subCo[cid].forEach(f=>f()); delete subCo[cid]; dropCo('vehicles', cid); dropCo('tours', cid); } });
    const listen = (cid, tries) => {
      subCo[cid] = ['vehicles','tours'].map(col => db.collection('companies').doc(cid).collection(col).onSnapshot(sn => {
        dropCo(col, cid); sn.docs.forEach(d => S[col][d.id] = {...d.data(), companyId: cid}); loaded[col] = true; render();
      }, err => {
        // Access can lag a moment behind joining or creating a company: try again shortly.
        if (subCo[cid]) { subCo[cid].forEach(f=>f()); delete subCo[cid]; }
        if (tries < 4 && S.companies[cid]) setTimeout(() => { if (S.companies[cid] && !subCo[cid]) listen(cid, tries+1); }, 1500 * (tries+1));
        else toast('Could not load ' + col + ': ' + (err?.message || err?.code));
      }));
    };
    Object.keys(mine).forEach(cid => { if (!subCo[cid] && !pending.has(cid)) listen(cid, 0); });
    if (!Object.keys(mine).length) { loaded.vehicles = loaded.tours = true; }
    pickCompany(); render(); if (draftKind === 'company') renderSheet();
  }, err => { loaded.companies = true; toast('Could not load companies: ' + (err?.message || err?.code)); render(); }));
  if (myEmail()) unsubs.push(db.collection('companies').where('invites', 'array-contains', myEmail()).onSnapshot(snap => {
    invites = {}; snap.docs.forEach(d => { if (!(d.data().members||[]).includes(user.uid)) invites[d.id] = d.data(); }); render();
  }, () => {}));
}
function pickCompany(){
  if (companyId && S.companies[companyId]) return;
  const remembered = lsGet('tfd-company');
  const ids = Object.keys(S.companies).sort((a,b)=> (S.companies[a].name||'').localeCompare(S.companies[b].name||''));
  companyId = (remembered && S.companies[remembered]) ? remembered : (ids[0] || null);
}

/* ---------- domain ---------- */
const vehiclesOf = () => Object.entries(S.vehicles).filter(([,v]) => v.companyId === companyId).map(([id,v]) => ({id, ...v})).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
const toursOf = () => Object.entries(S.tours).filter(([,t]) => t.companyId === companyId).map(([id,t]) => ({id, ...t})).sort((a,b)=>(a.start||'').localeCompare(b.start||''));
const paidOf = t => (t.payments||[]).reduce((s,p)=>s+n(p.amount),0);
function payStatus(t){
  const total = n(t.total), paid = paidOf(t);
  if (total > 0 && paid >= total) return 'paid';
  if (paid > 0) return 'partial';
  return 'pending';
}
const isOverdue = t => !t.cancelled && payStatus(t) !== 'paid' && t.dueDate && t.dueDate < today();
function payChip(t){
  if (t.cancelled) return '<span class="chip cancel">Cancelled</span>';
  const s = payStatus(t);
  const label = {paid:'Paid',partial:'Partly paid',pending:'Pending'}[s];
  return `<span class="chip ${s}">${label}</span>` + (isOverdue(t) ? ' <span class="chip overdue">Overdue</span>' : '');
}
function tripState(t){
  if (t.cancelled) return 'Cancelled';
  const d = today();
  if (t.end < d) return 'Completed'; if (t.start > d) return 'Upcoming'; return 'On tour';
}
function bookingsFor(vid, from, to, exceptTourId){
  return toursOf().filter(t => !t.cancelled && t.id !== exceptTourId && (t.vehicleIds||[]).includes(vid) && t.start && t.end && overlaps(t.start,t.end,from,to));
}
const t12 = v => { if (!v) return ''; const [h,m] = v.split(':').map(Number); return (h%12||12) + ':' + pad(m) + (h<12?' AM':' PM'); };
const times = t => [t.arrTime||t.arrFlight ? 'Arrive ' + [t12(t.arrTime), t.arrFlight].filter(Boolean).join(' · ') : '', t.depTime||t.depFlight ? 'Depart ' + [t12(t.depTime), t.depFlight].filter(Boolean).join(' · ') : ''].filter(Boolean).join(' — ');
const vName = id => { const v = S.vehicles[id]; return v ? v.name : 'Removed vehicle'; };
const exTag = o => o?.example ? ' <span class="chip ex">Example</span>' : '';

/* ---------- render ---------- */
function render(){
  const sel = $('#companySel');
  const cos = Object.entries(S.companies).sort((a,b)=>(a[1].name||'').localeCompare(b[1].name||''));
  sel.innerHTML = cos.length ? cos.map(([id,c]) => `<option value="${id}"${id===companyId?' selected':''}>${esc(c.name)}</option>`).join('') : '<option>No company yet</option>';
  sel.disabled = !cos.length;
  const bm = $('#brandMark'), logo = S.companies[companyId]?.logo || '';
  if (!bm.dataset.svg) bm.dataset.svg = bm.innerHTML;
  if ((bm.dataset.logo || '') !== logo) { bm.dataset.logo = logo; bm.innerHTML = logo ? `<img src="${esc(logo)}" alt="" style="height:34px;width:auto;max-width:110px;object-fit:contain;border-radius:6px">` : bm.dataset.svg; }
  $('#signOut').hidden = !user; $('#manageCo').hidden = mode === 'login' || mode === 'denied';
  document.querySelectorAll('#tabs a').forEach(a => a.dataset.v === view ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
  const m = $('#main');
  if (mode === 'loading') { m.innerHTML = '<div class="empty">Loading your fleet…</div>'; return; }
  let banner = '';
  if (mode === 'login') { m.innerHTML = loginView(); return; }
  if (mode === 'denied') { m.innerHTML = noAccessView(); return; }
  if (mode === 'local') banner = '<div class="banner">Firebase is not set up yet, so data is saved in this browser only. Add your Firebase settings to firebase-config.js.</div>';
  if (mode === 'slow') banner = '<div class="banner">Still waiting for saved data. Check your connection; the page will update when it arrives.</div>';
  const inv = Object.entries(invites);
  if (inv.length) banner += inv.map(([cid,c]) => `<div class="panel spread"><div>You are invited to join <b>${esc(c.name)}</b>${c.memberInfo?.[c.ownerId] ? ' by ' + esc(c.memberInfo[c.ownerId]) : ''}.</div><button class="primary small" data-act="joinCo" data-id="${cid}">Join company</button></div>`).join('');
  if (!companyId) { m.innerHTML = banner + noCompany(); return; }
  const body = { overview:vOverview, tours:vTours, availability:vAvail, vehicles:vVehicles }[view]();
  m.innerHTML = banner + body;
}

function loginView(){
  return `<div class="panel" style="max-width:400px;margin:40px auto;width:100%"><div class="sec">
    <h2>Sign in</h2><p class="muted" style="margin:0">Sign in with your Google account. New here? Signing in creates your account, then you can add your company.</p>
    <div id="lgErr" class="warnbox" hidden></div>
    <button class="primary" data-act="google" style="display:flex;gap:10px;align-items:center;justify-content:center">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Sign in with Google</button></div></div>`;
}
function noAccessView(){
  return `<div class="panel" style="max-width:460px;margin:40px auto;width:100%"><div class="sec">
    <h2>No access for this account</h2>
    <p style="margin:0">You are signed in as <b>${esc(user?.email)}</b>, but this account is not on the approved list. Ask the owner to add it, or sign in with another Google account.</p>
    <button data-act="signOutBtn">Use another account</button></div></div>`;
}
function noCompany(){
  return `<div class="panel"><div class="empty">
    <h2 style="color:var(--fg)">Add your rental company</h2>
    <p style="max-width:52ch;margin:0">Start with your company name. Then add vehicles, record tours with their dates and customers, and track every payment. You can run several companies from here.</p>
    <div class="row"><button class="primary" data-act="newCompany">Add company</button><button data-act="loadSample">Load example data</button></div>
  </div></div>`;
}

function monthCalendar(){
  const t0 = today();
  if (!ui.calMonth) ui.calMonth = t0.slice(0,7);
  const [Y, M] = ui.calMonth.split('-').map(Number);
  const first = new Date(Y, M-1, 1), last = new Date(Y, M, 0);
  const mFrom = iso(first), mTo = iso(last);
  const gridStart = addDays(mFrom, -((first.getDay()+6)%7));      // weeks start Monday
  const weeks = Math.ceil((daysBetween(gridStart, mTo)+1)/7);
  const vs = vehiclesOf();
  let ts = toursOf().filter(t => !t.cancelled && t.start && t.end);
  if (ui.calVeh) ts = ts.filter(t => (t.vehicleIds||[]).includes(ui.calVeh));
  const inMonth = ts.filter(t => overlaps(t.start,t.end,mFrom,mTo));
  const value = inMonth.reduce((s,t)=>s+n(t.total),0), got = inMonth.reduce((s,t)=>s+paidOf(t),0);
  const busyDays = vs.length ? Math.round(100 * vs.reduce((s,v)=>{ let d=0; for(let i=0;i<=daysBetween(mFrom,mTo);i++){ const day=addDays(mFrom,i); if (ts.some(t=>(t.vehicleIds||[]).includes(v.id)&&t.start<=day&&t.end>=day)) d++; } return s+d; },0) / (vs.length*(daysBetween(mFrom,mTo)+1))) : 0;
  const cls = t => isOverdue(t) ? 'overdue' : payStatus(t);
  let html = '';
  for (let w=0; w<weeks; w++){
    const ws = addDays(gridStart, w*7), we = addDays(ws, 6);
    const cells = Array.from({length:7}, (_,i) => { const d = addDays(ws,i); return `<div class="cell${d.slice(0,7)!==ui.calMonth?' out':''}${d===t0?' today':''}" data-act="calDay" data-d="${d}" title="Add a tour starting ${fmtDY(d)}"><span class="dn">${parse(d).getDate()}</span></div>`; }).join('');
    const wt = ts.filter(t => overlaps(t.start,t.end,ws,we)).sort((a,b)=> a.start.localeCompare(b.start) || b.end.localeCompare(a.end));
    const lanes = []; let bars = '';
    wt.forEach(t => {
      const s = Math.max(0, daysBetween(ws, t.start)), e = Math.min(6, daysBetween(ws, t.end));
      let lane = lanes.findIndex(endCol => endCol < s); if (lane < 0) { lane = lanes.length; lanes.push(e); } else lanes[lane] = e;
      const veh = (t.vehicleIds||[]).map(vName).join(', ');
      bars += `<button class="bar ${cls(t)}${t.start<ws?' cont-l':''}${t.end>we?' cont-r':''}" style="grid-column:${s+1} / ${e+2};grid-row:${lane+1}" data-act="editTour" data-id="${t.id}" title="${esc(t.customer+' · '+range(t.start,t.end)+(times(t)?' · '+times(t):'')+(veh?' · '+veh:'')+' · '+money(n(t.total)-paidOf(t))+' due')}">${esc(t.customer||'Tour')}${veh?` <span class="veh">· ${esc(veh)}</span>`:''}</button>`;
    });
    html += `<div class="wk"><div class="bg">${cells}</div><div class="bars">${bars}</div></div>`;
  }
  const dows = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const monthName = first.toLocaleString('en-US',{month:'long'});
  return `<section class="panel cal">
    <div class="cal-head">
      <div class="cal-title">${monthName} ${Y}<small>${inMonth.length} tour${inMonth.length===1?'':'s'}</small></div>
      <div class="row">
        <select id="calVeh" aria-label="Show vehicle" style="width:auto"><option value="">All vehicles</option>${vs.map(v=>`<option value="${v.id}"${v.id===ui.calVeh?' selected':''}>${esc(v.name)}${v.plate?' · '+esc(v.plate):''}</option>`).join('')}</select>
        <div class="cal-nav"><button data-act="calMove" data-m="-1" aria-label="Previous month">‹</button><button data-act="calToday">Today</button><button data-act="calMove" data-m="1" aria-label="Next month">›</button></div>
        <button class="primary" data-act="newTour">New tour</button>
      </div>
    </div>
    <div class="mstats"><div>Tour value<b>${money(value)}</b></div><div>Received<b>${money(got)}</b></div><div>To collect<b>${money(value-got)}</b></div><div>Fleet booked<b>${busyDays}%</b></div></div>
    <div style="overflow-x:auto"><div class="cal-grid">
      <div class="cal-dow">${dows.map((d,i)=>`<div class="${i>4?'we':''}">${d}</div>`).join('')}</div>
      ${html}
    </div></div>
    ${inMonth.length ? `<div class="list agenda">${inMonth.map(t=>`<div><div><button class="link" data-act="editTour" data-id="${t.id}">${esc(t.customer||'Tour')}</button><div class="muted" style="font-size:12px">${range(t.start,t.end)} · ${(t.vehicleIds||[]).map(vName).map(esc).join(', ')||'No vehicle'}</div></div>${payChip(t)}</div>`).join('')}</div>` : ''}
    <div class="spread"><div class="legend"><span><i style="background:var(--ok)"></i>Paid</span><span><i style="background:var(--warn)"></i>Partly paid</span><span><i style="background:var(--busy)"></i>Pending</span><span><i style="background:var(--bad)"></i>Overdue</span></div>
      <span class="muted" style="font-size:12px">Click a day to add a tour. Click a bar to open it.</span></div>
  </section>`;
}

function vOverview(){
  const vs = vehiclesOf(), ts = toursOf().filter(t=>!t.cancelled), d = today(), in30 = addDays(d,30);
  const active = ts.filter(t => t.start <= d && t.end >= d);
  const upcoming = ts.filter(t => t.start > d && t.start <= in30);
  const received = ts.reduce((s,t)=>s+paidOf(t),0);
  const outstanding = ts.reduce((s,t)=>s+Math.max(0,n(t.total)-paidOf(t)),0);
  const busyIds = new Set(active.flatMap(t=>t.vehicleIds||[]));
  const due = ts.filter(t => payStatus(t)!=='paid' && n(t.total)>0).sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999')).slice(0,8);
  return monthCalendar() + `
  <div class="stats">
    <div class="stat"><span>Vehicles free today</span><b>${vs.length - vs.filter(v=>busyIds.has(v.id)).length} / ${vs.length}</b></div>
    <div class="stat"><span>On tour now</span><b>${active.length}</b></div>
    <div class="stat"><span>Starting in 30 days</span><b>${upcoming.length}</b></div>
    <div class="stat"><span>Received</span><b>${money(received)}</b></div>
    <div class="stat"><span>Still to collect</span><b style="color:${outstanding?'var(--warn)':'inherit'}">${money(outstanding)}</b></div>
  </div>
  <div class="grid2">
    <section class="panel sec">
      <div class="spread"><h2>On tour and coming up</h2><button class="primary small" data-act="newTour">New tour</button></div>
      ${[...active, ...upcoming].length ? `<div class="list">${[...active,...upcoming].map(t=>`
        <div><div><button class="link" data-act="editTour" data-id="${t.id}">${esc(t.customer||'Unnamed')}</button>${exTag(t)}
          <div class="muted" style="font-size:13px">${range(t.start,t.end)} · ${(t.vehicleIds||[]).map(vName).map(esc).join(', ') || 'No vehicle'}</div>${times(t)?`<div class="muted" style="font-size:12px">${esc(times(t))}</div>`:''}</div>
          <span class="chip ${t.start<=d?'busy':'pending'}">${tripState(t)}</span></div>`).join('')}</div>`
        : '<div class="empty">No tours in the next 30 days.</div>'}
    </section>
    <section class="panel sec">
      <div class="spread"><h2>Payments to collect</h2><a href="#tours" class="muted" style="font-size:13px">All payments</a></div>
      ${due.length ? `<div class="list">${due.map(t=>`
        <div><div><button class="link" data-act="editTour" data-id="${t.id}">${esc(t.customer||'Unnamed')}</button>
          <div class="muted" style="font-size:13px">Due ${fmtDY(t.dueDate)} · tour ${fmtD(t.start)}</div></div>
          <div style="text-align:right"><div class="num">${money(n(t.total)-paidOf(t))}</div>${payChip(t)}</div></div>`).join('')}</div>`
        : '<div class="empty">Every tour is fully paid.</div>'}
    </section>
  </div>`;
}

function vTours(){
  const d = today();
  let ts = toursOf();
  if (ui.tourWhen==='upcoming') ts = ts.filter(t => t.end >= d);
  if (ui.tourWhen==='past') ts = ts.filter(t => t.end < d).reverse();
  if (ui.tourFilter==='overdue') ts = ts.filter(isOverdue);
  else if (ui.tourFilter!=='all') ts = ts.filter(t => !t.cancelled && payStatus(t)===ui.tourFilter);
  const q = ui.tourQ.trim().toLowerCase();
  if (q) ts = ts.filter(t => [t.customer,t.country,t.phone,t.guide,t.invoice?.no,...(t.vehicleIds||[]).map(vName)].join(' ').toLowerCase().includes(q));
  const tot = ts.filter(t=>!t.cancelled).reduce((a,t)=>({total:a.total+n(t.total),paid:a.paid+paidOf(t)}),{total:0,paid:0});
  return `
  <div class="spread">
    <h2>Tours &amp; payments</h2>
    <button class="primary" data-act="newTour">New tour</button>
  </div>
  <div class="row">
    <select id="fWhen" style="width:auto"><option value="upcoming">Current &amp; upcoming</option><option value="past">Past tours</option><option value="all">All tours</option></select>
    <select id="fPay" style="width:auto"><option value="all">Any payment status</option><option value="pending">Pending</option><option value="partial">Partly paid</option><option value="paid">Paid</option><option value="overdue">Overdue</option></select>
    <input id="fQ" type="search" placeholder="Search customer, vehicle, invoice no" style="max-width:280px" value="${esc(ui.tourQ)}">
  </div>
  <div class="tablebox"><table>
    <thead><tr><th>Dates</th><th>Customer / group</th><th>Vehicles</th><th class="num">Total</th><th class="num">Paid</th><th class="num">Balance</th><th>Payment</th></tr></thead>
    <tbody>${ts.length ? ts.map(t => `<tr class="click" data-act="editTour" data-id="${t.id}">
      <td class="mono" style="white-space:nowrap">${range(t.start,t.end)}<div class="muted" style="font-size:12px;font-family:var(--body)">${tripState(t)} · ${t.start&&t.end?daysBetween(t.start,t.end)+1:'?'} days</div>${times(t)?`<div class="muted" style="font-size:12px;font-family:var(--body);white-space:normal">${esc(times(t))}</div>`:''}</td>
      <td><b style="font-weight:600">${esc(t.customer||'Unnamed')}</b>${exTag(t)}<div class="muted" style="font-size:12px">${t.pax?esc(t.pax)+' pax':''}${t.country?' · '+esc(t.country):''}</div></td>
      <td>${(t.vehicleIds||[]).map(id=>esc(vName(id))).join('<br>') || '<span class="muted">—</span>'}</td>
      <td class="num">${money(t.total)}</td><td class="num">${money(paidOf(t))}</td><td class="num">${money(Math.max(0,n(t.total)-paidOf(t)))}</td>
      <td>${payChip(t)}${t.dueDate && payStatus(t)!=='paid' && !t.cancelled ? `<div class="muted" style="font-size:12px">due ${fmtD(t.dueDate)}</div>`:''}${t.invoice?.no?`<div class="muted mono" style="font-size:12px">${esc(t.invoice.no)}</div>`:''}</td></tr>`).join('')
      : `<tr><td colspan="7"><div class="empty">No tours match these filters.</div></td></tr>`}</tbody>
  </table></div>
  ${ts.length ? `<div class="sum"><div><span class="muted">Total value</span><b>${money(tot.total)}</b></div><div><span class="muted">Received</span><b>${money(tot.paid)}</b></div><div><span class="muted">Balance</span><b>${money(tot.total-tot.paid)}</b></div></div>`:''}`;
}

function vAvail(){
  if (!ui.avFrom) { ui.avFrom = today(); ui.avTo = addDays(today(), 13); }
  let from = ui.avFrom, to = ui.avTo < ui.avFrom ? ui.avFrom : ui.avTo;
  const span = Math.min(daysBetween(from,to)+1, 62);
  const vsAll = vehiclesOf();
  const types = [...new Set(vsAll.map(v=>v.type).filter(Boolean))].sort();
  const vs = vsAll.filter(v => !ui.avType || v.type===ui.avType);
  const rows = vs.map(v => ({v, b: bookingsFor(v.id, from, to)}));
  const free = rows.filter(r=>!r.b.length), busy = rows.filter(r=>r.b.length);
  const days = Array.from({length:span}, (_,i)=>addDays(from,i));
  return `
  <div class="spread"><h2>Vehicle availability</h2></div>
  <div class="panel row" style="align-items:end">
    <label class="f" style="width:170px">From<input type="date" id="avFrom" value="${from}"></label>
    <label class="f" style="width:170px">To<input type="date" id="avTo" value="${to}"></label>
    <label class="f" style="width:170px">Vehicle type<select id="avType"><option value="">All types</option>${types.map(t=>`<option${t===ui.avType?' selected':''}>${esc(t)}</option>`).join('')}</select></label>
    <div class="row" style="padding-bottom:2px">
      <button class="small" data-act="avQuick" data-d="7">Next 7 days</button>
      <button class="small" data-act="avQuick" data-d="14">Next 14 days</button>
      <button class="small" data-act="avQuick" data-d="30">Next 30 days</button>
    </div>
  </div>
  ${!vs.length ? '<div class="panel"><div class="empty">Add vehicles first to see their availability.<button class="primary" data-act="newVehicle">Add vehicle</button></div></div>' : `
  <div class="grid2">
    <section class="panel sec"><h3>Free for the whole range · ${free.length}</h3>
      ${free.length ? `<div class="list">${free.map(({v})=>`<div><div><b style="font-weight:600">${esc(v.name)}</b> <span class="plate">${esc(v.plate||'')}</span><div class="muted" style="font-size:12px">${esc(v.type||'')}${v.seats?' · '+esc(v.seats)+' seats':''}${v.rate?' · '+money(v.rate)+'/day':''}</div></div>
        <button class="small" data-act="bookVehicle" data-id="${v.id}">Book</button></div>`).join('')}</div>` : '<div class="empty">No vehicle is free for every day of this range.</div>'}
    </section>
    <section class="panel sec"><h3>Booked during this range · ${busy.length}</h3>
      ${busy.length ? `<div class="list">${busy.map(({v,b})=>`<div><div><b style="font-weight:600">${esc(v.name)}</b> <span class="plate">${esc(v.plate||'')}</span>
        <div style="font-size:12px">${b.map(t=>`<button class="link" data-act="editTour" data-id="${t.id}">${esc(t.customer||'Tour')}</button> <span class="muted">${range(t.start,t.end)}</span>`).join('<br>')}</div></div>
        <span class="chip busy">Busy</span></div>`).join('')}</div>` : '<div class="empty">Nothing booked in this range.</div>'}
    </section>
  </div>
  <section class="panel sec">
    <div class="spread"><h3>Day by day</h3><span class="muted" style="font-size:12px">${span<daysBetween(from,to)+1?'Showing the first 62 days. ':''}Blue = on a tour. Hover a block to see the customer.</span></div>
    <div style="overflow-x:auto"><table class="tl">
      <thead><tr><th></th>${days.map(d=>{const dt=parse(d);const we=dt.getDay()===0||dt.getDay()===6;return `<th class="d${we?' we':''}">${WD[dt.getDay()].slice(0,2)}<br>${dt.getDate()}</th>`}).join('')}</tr></thead>
      <tbody>${rows.map(({v,b})=>`<tr><td class="v">${esc(v.name)}</td>${days.map(d=>{
        const t = b.find(t=>t.start<=d && t.end>=d);
        if(!t) return '<td class="c"></td>';
        return `<td class="c on${t.start===d||d===from?' start':''}${t.end===d||d===days[days.length-1]?' end':''}" title="${esc((t.customer||'Tour')+' · '+range(t.start,t.end))}"></td>`;
      }).join('')}</tr>`).join('')}</tbody>
    </table></div>
  </section>`}`;
}

function vVehicles(){
  const vs = vehiclesOf(), d = today();
  return `
  <div class="spread"><h2>Vehicles · ${esc(S.companies[companyId]?.name)}</h2><button class="primary" data-act="newVehicle">Add vehicle</button></div>
  <div class="tablebox"><table>
    <thead><tr><th>Vehicle</th><th>Number plate</th><th>Type</th><th class="num">Seats</th><th class="num">Daily rate</th><th>Driver</th><th>Now / next</th></tr></thead>
    <tbody>${vs.length ? vs.map(v => {
      const b = toursOf().filter(t=>!t.cancelled && (t.vehicleIds||[]).includes(v.id) && t.end >= d);
      const now = b.find(t=>t.start<=d);
      const next = b.find(t=>t.start>d);

        <td><span class="plate">${esc(v.plate||'—')}</span></td><td>${esc(v.type||'—')}</td><td class="num">${esc(v.seats||'—')}</td>
        <td class="num">${v.rate?money(v.rate):'—'}</td><td>${esc(v.driver||'—')}${v.driverPhone?`<div class="muted mono" style="font-size:12px">${esc(v.driverPhone)}</div>`:''}</td>
        <td>${now?`<span class="chip busy">On tour until ${fmtD(now.end)}</span>`:'<span class="chip free">Free today</span>'}${next?`<div class="muted" style="font-size:12px">Next: ${fmtD(next.start)} · ${esc(next.customer||'')}</div>`:''}</td></tr>`;
    }).join('') : `<tr><td colspan="7"><div class="empty">No vehicles yet. Add your cars, vans and buses to start booking tours.</div></td></tr>`}</tbody>
  </table></div>`;
}

/* ---------- sheets (editors) ---------- */
function openSheet(kind, data){ draftKind = kind; draft = data; renderSheet(); $('.sheet').classList.add('anim'); $('.sheet').scrollTop = 0; if (!matchMedia('(pointer:coarse)').matches) $('.sheet input:not([type=checkbox])')?.focus({preventScroll:true}); }
function closeSheet(){ draft = null; draftKind = null; invOpen = false; $('#sheetRoot').innerHTML = ''; $('#invRoot').innerHTML = ''; }
function renderSheet(){
  if (!draft) return;
  const html = { tour:sheetTour, vehicle:sheetVehicle, company:sheetCompany }[draftKind]();
  const y = $('.sheet')?.scrollTop || 0;
  $('#sheetRoot').innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $('.sheet').scrollTop = y;
}
const fld = (label, key, type='text', extra='') => `<label class="f">${label}<input id="d-${key}" data-f="${key}" type="${type}" value="${esc(draft[key]??'')}" ${extra}></label>`;
function head(title, canDelete, extra=''){
  return `<div class="sheet-head"><h2>${title}</h2><div class="row">
    ${canDelete?'<button class="danger small" data-act="del">Delete</button>':''}${extra}
    <button data-act="close">Cancel</button><button class="primary" data-act="saveDraft">Save</button></div></div>`;
}

function teamSection(){
  if (!db || !draft._id) return '';
  const c = S.companies[draft._id]; if (!c) return '';
  const owner = c.ownerId === user?.uid;
  const members = (c.members||[]).map(uid => ({uid, email: c.memberInfo?.[uid] || 'Team member', owner: uid === c.ownerId}));
  return `<section class="sec"><h3 style="font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--body);font-weight:600">Team</h3>
    <div class="list">${members.map(m => `<div><div>${esc(m.email)}${m.uid===user.uid?' <span class="muted">(you)</span>':''}</div>
      ${m.owner ? '<span class="chip paid">Owner</span>' : (owner ? `<button class="danger small" data-act="rmMember" data-id="${m.uid}">Remove</button>` : '<span class="chip pending">Member</span>')}</div>`).join('')}
    ${(c.invites||[]).map(e => `<div><div>${esc(e)} <span class="muted">· invited, not joined yet</span></div>${owner ? `<button class="danger small" data-act="rmInvite" data-email="${esc(e)}">Cancel</button>` : ''}</div>`).join('')}</div>
    ${owner ? `<div class="row" style="flex-wrap:nowrap"><input id="d-_invite" data-f="_invite" type="email" placeholder="staff.member@gmail.com" value="${esc(draft._invite||'')}"><button data-act="invite">Invite</button></div>
      <div class="muted" style="font-size:12px">They sign in with that Google account and click Join company.</div>` : ''}
  </section>`;
}
function sheetCompany(){
  const list = Object.entries(S.companies);
  return head(draft._id ? 'Edit company' : 'Add company', !!draft._id && isOwner(draft._id)) + `<div class="sheet-body">
    <div class="fields">${fld('Company name','name','text','required')}${fld('Phone','phone','tel')}${fld('Email','email','email')}${fld('Currency code','currency','text','maxlength="4" placeholder="LKR"')}${fld('Website','website','url','placeholder="www.yourcompany.lk"')}</div>
    <div class="f" style="display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500">Logo (shown on invoices and at the top of the app)
      <div class="logo-box">${draft.logo ? `<img src="${esc(draft.logo)}" alt="Company logo">` : '<span class="muted">No logo yet</span>'}
        <div class="row"><label class="btn small" style="padding:4px 8px;font-size:13px">${draft.logo ? 'Change logo' : 'Upload logo'}<input type="file" id="logoFile" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden></label>
        ${draft.logo ? '<button class="danger small" data-act="rmLogo">Remove</button>' : ''}</div></div>
      <span style="font-weight:400">PNG with a transparent background looks best. It is resized automatically.</span></div>
    <label class="f">Address / location (shown on invoices and proposals)<textarea data-f="address" id="d-address" placeholder="No. 12, Lake Road, Negombo">${esc(draft.address||'')}</textarea></label>
    <label class="f">Invoice footer: bank details, terms<textarea data-f="invoiceNote" id="d-invoiceNote" placeholder="Bank: BOC, Negombo · Acc: 0000000 · Name: …">${esc(draft.invoiceNote||'')}</textarea></label>
    ${teamSection()}
    ${list.length ? `<div class="sec"><div class="spread"><h3>Your companies</h3><button class="small" data-act="newCompany">Add another</button></div>
      <div class="list">${list.map(([id,c])=>`<div><div><b style="font-weight:600">${esc(c.name)}</b>${exTag(c)}<div class="muted" style="font-size:12px">${db ? (c.ownerId===user?.uid ? 'Owner · ' : 'Member · ') : ''}${Object.values(S.vehicles).filter(v=>v.companyId===id).length} vehicles · ${Object.values(S.tours).filter(t=>t.companyId===id).length} tours</div></div>
      <button class="small" data-act="editCompany" data-id="${id}">Edit</button></div>`).join('')}</div></div>`:''}
  </div>`;

function sheetVehicle(){
  return head(draft._id ? 'Edit vehicle' : 'Add vehicle', !!draft._id) + `<div class="sheet-body">
    <div class="fields">
      ${fld('Vehicle name / model','name','text','placeholder="Toyota KDH van"')}
      ${fld('Number plate','plate','text','placeholder="WP PH-4521"')}
      <label class="f">Type<select data-f="type" id="d-type">${['Car','Van','Mini bus','Bus','SUV / Jeep','Tuk tuk','Other'].map(t=>`<option${draft.type===t?' selected':''}>${t}</option>`).join('')}</select></label>
      ${fld('Seats','seats','number','min="1"')}
      ${fld('Daily rate ('+esc(cur())+')','rate','number','min="0"')}
      ${fld('Driver name','driver')}
      ${fld('Driver phone','driverPhone','tel')}
    </div>
    <label class="f">Notes<textarea data-f="notes" id="d-notes" placeholder="A/C, luggage space, insurance renewal date…">${esc(draft.notes||'')}</textarea></label>
  </div>`;
}

function sheetTour(){
  const t = draft, vs = vehiclesOf();
  const total = n(t.total), paid = (t.payments||[]).reduce((s,p)=>s+n(p.amount),0);
  const status = payStatus(t);
  const clashes = [];
  const vpick = vs.length ? vs.map(v => {
    const b = t.start && t.end ? bookingsFor(v.id, t.start, t.end, t._id) : [];
    const on = (t.vehicleIds||[]).includes(v.id);
    if (on && b.length) clashes.push(`${v.name} is already booked for ${b.map(x=>esc(x.customer)+' ('+range(x.start,x.end)+')').join(', ')}`);
    return `<label class="${on&&b.length?'clash':''}"><input type="checkbox" data-veh="${v.id}" ${on?'checked':''}>
      <span><b style="font-weight:600">${esc(v.name)}</b> <span class="plate">${esc(v.plate||'')}</span><br>
      <span class="muted">${esc(v.type||'')}${v.seats?' · '+esc(v.seats)+' seats':''}</span>
      ${t.start&&t.end ? (b.length?` <span class="chip busy">Booked</span>`:` <span class="chip free">Free</span>`):''}</span></label>`;
  }).join('') : '<div class="muted">No vehicles yet. Add vehicles in the Vehicles tab.</div>';
  const days = t.start && t.end ? daysBetween(t.start, t.end) + 1 : 0;

function itinText(t){

    lines.push(`Day ${i+1}${d.date?' ('+WD[parse(d.date).getDay()]+' '+fmtDY(d.date)+')':''}: ${d.route||''}${d.km?' · '+d.km+' km':''}`);

// Shrink the picture in the browser and keep it on the company as a small data URL (no extra storage service needed).
function readLogo(file){
  if (!/^image\//.test(file.type)) return toast('Choose a picture file (PNG or JPG)');
  if (file.size > 10e6) return toast('That picture is too big. Use one under 10 MB.');
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const w0 = img.naturalWidth || 400, h0 = img.naturalHeight || 200, k = Math.min(1, 480 / w0, 200 / h0);
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w0 * k)); c.height = Math.max(1, Math.round(h0 * k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    let data = c.toDataURL('image/png');
    if (data.length > 150000) data = c.toDataURL('image/webp', .9);   // keeps transparency where supported
    if (data.length > 150000) {                                        // last resort: JPEG on a white background
      const j = document.createElement('canvas'); j.width = c.width; j.height = c.height; const g = j.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, j.width, j.height); g.drawImage(c, 0, 0); data = j.toDataURL('image/jpeg', .85);
    }
    if (data.length > 300000) return toast('Could not make that logo small enough. Try a simpler picture.');
    if (draft && draftKind === 'company') { draft.logo = data; renderSheet(); toast('Logo added. Click Save.'); }
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Could not read that picture'); };
  img.src = url;
}

    <div class="blocks">

        <div class="kv" style="margin-top:4px">${kv('Country', t.country)}${kv('People', t.pax ? t.pax + ' pax' : '')}${kv('Phone', t.phone)}${kv('Email', t.email)}</div></div>
      <div><div class="lbl">Your tour</div><b>${range(t.start,t.end)}</b>${days?` <span style="color:#6a7673">· ${days} days, ${days-1} nights</span>`:''}
        <div class="kv" style="margin-top:4px">${kv('Arrival', [t12(t.arrTime), t.arrFlight].filter(Boolean).join(' · '))}${kv('Departure', [t12(t.depTime), t.depFlight].filter(Boolean).join(' · '))}${kv('Pick-up', t.pickup)}${kv('Drop-off', t.dropoff)}${kv('Distance', km ? 'about ' + km.toLocaleString() + ' km' : '')}</div></div>
    </div>
    ${vs.length ? `<h4>Vehicle</h4><div class="pvehs">${vs.map(v => `<div class="pveh"><span><b style="font-weight:600">${esc(v.name)}</b>${v.type?' · '+esc(v.type):''}</span><span style="color:#55625f">${v.seats?esc(v.seats)+' seats':''}${v.driver?(v.seats?' · ':'')+'Driver: '+esc(v.driver):''}</span></div>`).join('')}</div>` : ''}
    ${it.length ? `<h4>Day-by-day plan</h4><div class="pdays">${it.map(d => { const i = t.itinerary.indexOf(d); return `<div class="pday">
      <div class="dh">Day ${i+1}${d.route ? ': ' + esc(d.route) : ''}<small>${d.date ? WD[parse(d.date).getDay()] + ' ' + fmtDY(d.date) : ''}${d.km ? ' · ' + esc(d.km) + ' km' : ''}</small></div>
      ${d.activities ? `<p>${esc(d.activities)}</p>` : ''}${d.hotel ? `<div class="ht">Night: ${esc(d.hotel)}</div>` : ''}</div>`; }).join('')}</div>` : ''}
    <div class="pprice"><div><small>Tour price</small><div class="big">${price ? money2(price) : 'On request'}</div>${pv.priceNote ? `<small>${esc(pv.priceNote)}</small>` : ''}</div>
      ${price && pax > 1 ? `<div style="text-align:right"><small>Per person (${esc(pax)} people)</small><div class="mono" style="font-size:16px">${money2(price / pax)}</div></div>` : ''}</div>
    ${inc.length || exc.length ? `<div class="incl" style="margin-top:20px">
      ${inc.length ? `<div class="yes"><div class="lbl">Included</div><ul>${inc.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : '<div></div>'}
      ${exc.length ? `<div class="no"><div class="lbl">Not included</div><ul>${exc.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}</div>` : ''}
    <div class="notes">
      ${pv.terms ? `<div><div class="lbl">Booking terms</div><p>${esc(pv.terms)}</p></div>` : ''}
      ${co.invoiceNote ? `<div><div class="lbl">Payment details</div><p>${esc(co.invoiceNote)}</p></div>` : ''}
    </div>
    <div class="foot">To confirm this tour, reply to this proposal${co.phone ? ' or call ' + esc(co.phone) : ''}. We look forward to welcoming you.</div>`;
}
function renderProposal(){
  const pv = draft.proposal, y = $('.inv-layer')?.scrollTop || 0;
  const f = (label, key, type='text', extra='') => `<label class="f">${label}<input data-pv="${key}" type="${type}" value="${esc(pv[key]??'')}" ${extra}></label>`;
  const ta = (label, key, rows=4, hint='') => `<label class="f">${label}<textarea data-pv="${key}" rows="${rows}">${esc(pv[key]||'')}</textarea>${hint?`<span style="font-weight:400">${hint}</span>`:''}</label>`;
  const nIt = (draft.itinerary||[]).filter(d => d.route || d.activities || d.hotel).length;
  $('#invRoot').innerHTML = `<div class="inv-layer" role="dialog" aria-modal="true" aria-label="Proposal">
    ${docTools()}
    <div class="inv-wrap">
      <div class="inv-edit">
        <section class="panel sec"><h3>Proposal details</h3>
          <div class="fields">${f('Reference','no')}${f('Date','date','date')}${f('Valid until','validUntil','date')}${f('Price ('+esc(cur())+')','price','number','min="0" step="any"')}</div>
          ${f('Price note','priceNote')}
          <div id="invCheck">${propCheck()}</div>
        </section>
        <section class="panel sec"><h3>Message</h3>${ta('Opening message','intro',4)}</section>
        <section class="panel sec"><h3>What's included</h3>
          ${ta('Included','inclusions',5,'One item per line.')}${ta('Not included','exclusions',4,'One item per line.')}${ta('Booking terms','terms',3)}
        </section>
        <div class="muted" style="font-size:12px;padding:0 4px">${nIt ? `The day-by-day plan comes from the tour's itinerary (${nIt} day${nIt===1?'':'s'}).` : 'Tip: add days in the tour\'s <b>Itinerary</b> section to show a day-by-day plan here.'} Vehicles and dates come from the tour. Your logo and contact details come from <b>Companies › Edit</b>.</div>
      </div>
      <div class="paper" id="invPaper">${propPaper()}</div>
    </div></div>`;
  $('.inv-layer').scrollTop = y;
}

/* ---------- sample data (local mode only) ---------- */
function sampleData(){
  const c = uid(), t0 = today(), v = [uid(),uid(),uid(),uid()];
  S.companies[c] = {name:'Example: Lanka Tour Wheels', currency:'LKR', phone:'077 000 0000', example:true, ...(db ? {ownerId:user.uid, members:[user.uid], memberInfo:{[user.uid]:myEmail()}, invites:[]} : {})};
  [['Toyota KDH High Roof','WP PH-4521','Van',9,18000,'Nimal'],['Toyota Prius','CAR-7781','Car',3,12000,'Kasun'],['Toyota Coaster','NC-2290','Mini bus',26,32000,'Sunil'],['Suzuki Every','WP BHI-1203','Van',5,10000,'Ruwan']]
    .forEach(([name,plate,type,seats,rate,driver],i)=> S.vehicles[v[i]] = {companyId:c,name,plate,type,seats,rate,driver,example:true});
  const tours = [
    {customer:'Example: Müller family', pax:4, country:'Germany', start:addDays(t0,-2), end:addDays(t0,5), vehicleIds:[v[0]], total:240000, dueDate:addDays(t0,5), payments:[{date:addDays(t0,-20),amount:80000,method:'Bank transfer',note:'Advance'}],
      itinerary:[{date:addDays(t0,-2),route:'Airport → Negombo',km:12,hotel:'Jetwing Lagoon',activities:'Pick-up at BIA, rest day'},{date:addDays(t0,-1),route:'Negombo → Sigiriya',km:150,hotel:'Sigiriya Village',activities:'Dambulla cave temple'}]},
    {customer:'Example: Tanaka group', pax:18, country:'Japan', start:addDays(t0,6), end:addDays(t0,12), vehicleIds:[v[2]], total:560000, dueDate:addDays(t0,6), payments:[]},
    {customer:'Example: Sarah & Tom', pax:2, country:'UK', start:addDays(t0,3), end:addDays(t0,9), vehicleIds:[v[1]], total:150000, dueDate:addDays(t0,-1), payments:[{date:addDays(t0,-10),amount:50000,method:'Card',note:'Deposit'}]},
    {customer:'Example: Dubois couple', pax:2, country:'France', start:addDays(t0,-15), end:addDays(t0,-8), vehicleIds:[v[3]], total:96000, dueDate:addDays(t0,-8), payments:[{date:addDays(t0,-15),amount:96000,method:'Cash',note:'Full'}]},
  ];
  tours.forEach(t => S.tours[uid()] = {...t, companyId:c, example:true});
  companyId = c; lsSet('tfd-company', c);
  if (db) { docRef('companies', c, S.companies[c]).set(S.companies[c]).then(() => Promise.all(['vehicles','tours'].flatMap(col => Object.entries(S[col]).filter(([,d]) => d.companyId===c).map(([id,d]) => docRef(col,id,d).set(d))))).catch(e=>toast('Could not save: '+e.message)); }
  else lsSet('tfd-data', S);
  render();
}

/* ---------- events ---------- */
function setView(){ const h = location.hash.slice(1); view = ['overview','tours','availability','vehicles'].includes(h) ? h : 'overview'; render(); }
window.addEventListener('hashchange', setView);
$('#companySel').addEventListener('change', e => { companyId = e.target.value; lsSet('tfd-company', companyId); render(); });
$('#manageCo').addEventListener('click', () => { const c = S.companies[companyId]; openSheet('company', c ? {...c, _id:companyId} : {currency:'LKR'}); });

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'scrim') { if (e.target === el) closeSheet(); return; }
  if (el.tagName === 'TR' && e.target.closest('button,a,input')) return;
  switch (a) {
    case 'google': {
      const err = $('#lgErr'); err.hidden = true;
      const prov = new firebase.auth.GoogleAuthProvider(); prov.setCustomParameters({prompt:'select_account'});
      auth.signInWithPopup(prov).catch(x => {
        if (x.code === 'auth/popup-blocked' || x.code === 'auth/operation-not-supported-in-this-environment') return auth.signInWithRedirect(prov);
        if (x.code === 'auth/popup-closed-by-user' || x.code === 'auth/cancelled-popup-request') return;
        err.hidden = false; err.textContent = 'Could not sign in: ' + (x.message || x.code);
      });
      break; }
    case 'signOutBtn': auth && auth.signOut(); break;
    case 'joinCo': { const FV = firebase.firestore.FieldValue;
      coUpdate(id, {members: FV.arrayUnion(user.uid), invites: FV.arrayRemove(myEmail()), ['memberInfo.' + user.uid]: myEmail()}, 'You joined the company').then(() => { companyId = id; lsSet('tfd-company', id); });
      break; }
    case 'invite': { const e = (draft._invite||'').trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return toast('Enter a valid email address');
      coUpdate(draft._id, {invites: firebase.firestore.FieldValue.arrayUnion(e)}, 'Invite added. Ask them to sign in.'); draft._invite = ''; break; }
    case 'rmInvite': coUpdate(draft._id, {invites: firebase.firestore.FieldValue.arrayRemove(el.dataset.email)}); break;
    case 'rmMember': coUpdate(draft._id, {members: firebase.firestore.FieldValue.arrayRemove(id), ['memberInfo.' + id]: firebase.firestore.FieldValue.delete()}, 'Removed from team'); break;
    case 'newCompany': openSheet('company', {currency:'LKR'}); break;
    case 'editCompany': openSheet('company', {...S.companies[id], _id:id}); break;
    case 'loadSample': sampleData(); break;
    case 'newVehicle': if (!companyId) return; openSheet('vehicle', {type:'Van'}); break;
    case 'editVehicle': openSheet('vehicle', {...S.vehicles[id], _id:id}); break;
    case 'newTour': if (!companyId) return; openSheet('tour', {vehicleIds:[], payments:[], itinerary:[]}); break;
    case 'bookVehicle': openSheet('tour', {vehicleIds:[id], payments:[], itinerary:[], start:ui.avFrom, end:ui.avTo}); break;
    case 'editTour': { const t = S.tours[id]; openSheet('tour', JSON.parse(JSON.stringify({...t, vehicleIds:t.vehicleIds||[], payments:t.payments||[], itinerary:t.itinerary||[], _id:id}))); break; }
    case 'close': closeSheet(); break;
    case 'saveDraft': saveDraft(); break;
    case 'invOpen': openInvoice(); break;
    case 'propOpen': openProposal(); break;
    case 'propUseTotal': draft.total = n(draft.proposal.price); refreshInvoice(); toast('Tour price updated. Save to keep it.'); break;
    case 'rmLogo': draft.logo = ''; renderSheet(); break;
    case 'invBack': closeInvoice(); break;
    case 'invPrev': $('#invPaper').scrollIntoView({behavior:'smooth'}); break;
    case 'invSave': saveDraft(true); break;
    case 'invPrint': printInvoice(); break;
    case 'invAddLine': draft.invoice.items.push({desc:'', qty:1, rate:''}); renderInvoice(); $(`[data-il="${draft.invoice.items.length-1}"][data-k="desc"]`)?.focus(); break;
    case 'invRmLine': draft.invoice.items.splice(+el.dataset.i, 1); renderInvoice(); break;
    case 'invReset': draft.invoice.items = invDefaultItems(draft); renderInvoice(); toast('Items rebuilt from the tour'); break;
    case 'invUseTotal': draft.total = Math.round(invCalc(draft).total * 100) / 100; refreshInvoice(); toast('Tour price updated. Save to keep it.'); break;
    case 'del':
      if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = 'Click again to delete'; setTimeout(()=>{ if (el.isConnected){ el.classList.remove('armed'); el.textContent='Delete'; } }, 4000); return; }
      { const col = {tour:'tours',vehicle:'vehicles',company:'companies'}[draftKind], did = draft._id;
        if (draftKind === 'company') {
          const subs = [...Object.entries(S.vehicles).filter(([,v])=>v.companyId===did).map(([i])=>remove('vehicles',i)), ...Object.entries(S.tours).filter(([,t])=>t.companyId===did).map(([i])=>remove('tours',i))];
          companyId = null; closeSheet();
          Promise.all(subs).then(() => remove('companies', did)).then(() => { pickCompany(); render(); toast('Company deleted'); });
          break;
        }
        remove(col, did); pickCompany(); closeSheet(); render(); toast('Deleted'); }
      break;
    case 'addPay': draft.payments.push({date:today(), amount:'', method:'Cash', note:''}); renderSheet(); break;
    case 'addDay': { const last = draft.itinerary[draft.itinerary.length-1]; draft.itinerary.push({date: last?.date ? addDays(last.date,1) : (draft.start||''), route:'', km:'', hotel:'', activities:''}); renderSheet(); break; }
    case 'genDays': {
      const nDays = daysBetween(draft.start, draft.end) + 1; const old = draft.itinerary;
      draft.itinerary = Array.from({length:nDays}, (_,i) => ({...(old[i]||{route:'',km:'',hotel:'',activities:''}), date:addDays(draft.start,i)}));
      if (old.length > nDays) toast(`Kept the first ${nDays} days to match the dates`);
      renderSheet(); break; }
    case 'mvDay': { const i = +el.dataset.i, j = i + (+el.dataset.dir); const arr = draft.itinerary; [arr[i],arr[j]] = [arr[j],arr[i]]; renderSheet(); break; }
    case 'rmRow': draft[el.dataset.arr].splice(+el.dataset.i,1); renderSheet(); break;
    case 'copyItin': {
      const txt = itinText(draft);
      const fallback = () => { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok = document.execCommand('copy'); }catch{} ta.remove(); toast(ok?'Itinerary copied':'Copy blocked. Select the text manually.'); };
      try { navigator.clipboard.writeText(txt).then(()=>toast('Itinerary copied. Paste it into WhatsApp or email.'), fallback); } catch { fallback(); }
      break; }
    case 'calMove': { const [y,m] = ui.calMonth.split('-').map(Number); const d = new Date(y, m-1+(+el.dataset.m), 1); ui.calMonth = d.getFullYear()+'-'+pad(d.getMonth()+1); render(); break; }
    case 'calToday': ui.calMonth = today().slice(0,7); render(); break;
    case 'calDay': if (!companyId) return; { const d = el.dataset.d; openSheet('tour', {vehicleIds: ui.calVeh?[ui.calVeh]:[], payments:[], itinerary:[], start:d, end:addDays(d,6)}); } break;
    case 'avQuick': ui.avFrom = today(); ui.avTo = addDays(today(), +el.dataset.d - 1); render(); break;
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (invOpen && draft && el.closest('#invRoot')) {
    const v = el.type === 'number' ? (el.value === '' ? '' : +el.value) : el.value;
    if (el.dataset.pv) draft.proposal[el.dataset.pv] = v;
    else if (el.dataset.iv) draft.invoice[el.dataset.iv] = v;
    else if (el.dataset.il) draft.invoice.items[+el.dataset.il][el.dataset.k] = v;
    refreshInvoice(); return;
  }
  if (draft && el.closest('.sheet')) {
    if (el.dataset.f) { draft[el.dataset.f] = el.type === 'number' ? (el.value === '' ? '' : +el.value) : el.value; if (draftKind==='tour' && ['start','end','total'].includes(el.dataset.f) && e.type==='change') renderSheet(); }
    else if (el.dataset.arr) { const v = el.type === 'number' ? (el.value === '' ? '' : +el.value) : el.value; draft[el.dataset.arr][+el.dataset.i][el.dataset.k] = v; }
    return;
  }
  if (el.id === 'fQ') { ui.tourQ = el.value; const pos = el.selectionStart; render(); const q = $('#fQ'); q.focus(); try{ q.setSelectionRange(pos,pos); }catch{} }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.closest('#invRoot')) return;
  if (draft && el.id === 'logoFile') { if (el.files[0]) readLogo(el.files[0]); return; }
  if (draft && el.closest('.sheet')) {
    if (el.dataset.veh) { const s = new Set(draft.vehicleIds); el.checked ? s.add(el.dataset.veh) : s.delete(el.dataset.veh); draft.vehicleIds = [...s]; renderSheet(); }
    else if (el.dataset.fc) { draft[el.dataset.fc] = el.checked; renderSheet(); }
    else if (el.dataset.f && ['start','end','total','dueDate'].includes(el.dataset.f)) renderSheet();
    else if (el.dataset.arr === 'payments' && el.dataset.k === 'amount') renderSheet();
    return;
  }
  if (el.id === 'fWhen') { ui.tourWhen = el.value; render(); }
  if (el.id === 'fPay') { ui.tourFilter = el.value; render(); }
  if (el.id === 'avFrom') { ui.avFrom = el.value || today(); if (ui.avTo < ui.avFrom) ui.avTo = ui.avFrom; render(); }
  if (el.id === 'avTo') { ui.avTo = el.value || ui.avFrom; render(); }
  if (el.id === 'calVeh') { ui.calVeh = el.value; render(); }
  if (el.id === 'avType') { ui.avType = el.value; render(); }
});
$('#signOut').addEventListener('click', () => auth && auth.signOut());
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (invOpen) closeInvoice(); else if (draft) closeSheet(); } });
// keep filter selects showing current values after re-render
const _render = render;
render = function(){ _render();
  document.querySelectorAll('.tablebox table').forEach(tb => { const hs = [...tb.querySelectorAll('thead th')].map(th=>th.textContent.trim()); tb.querySelectorAll('tbody tr').forEach(tr => [...tr.children].forEach((td,i)=>{ if (!td.hasAttribute('colspan') && hs[i]) td.dataset.label = hs[i]; })); }); const w = $('#fWhen'); if (w) w.value = ui.tourWhen; const p = $('#fPay'); if (p) p.value = ui.tourFilter; };

setView();
boot();
})();
</script>
